name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release from manifest version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version custom_components/tapo_kasa_alarm/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          # A release that was deleted by hand can leave its tag behind on
          # an older commit. Move it to this commit so the release gets the
          # current code.
          tag_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Tag $tag points to $tag_sha, moving it to $GITHUB_SHA"
            git push origin ":refs/tags/$tag"
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Kasa Camera Control ${tag}. Kurulum için README'ye bakın."
